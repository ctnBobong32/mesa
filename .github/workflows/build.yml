# .github/workflows/mesa-android.yml
name: Mesa Android 交叉编译 (完整版)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ANDROID_SDK_VERSION: "29"
  S3_HOST: ${{ secrets.S3_HOST }}
  S3_JWT_FILE: ${{ secrets.S3_JWT_FILE }}

jobs:
  debian-android:
    name: Android 构建 (x86_64 + aarch64)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装系统依赖及升级 Meson
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build pkg-config python3-pip python3-mako python3-ply \
            git curl ca-certificates
          pip install --upgrade 'meson>=1.4.0'
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          meson --version

      - name: 安装 Android NDK (r25c)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_ROOT=${PWD}/android-ndk-r25c" >> $GITHUB_ENV
          echo "${PWD}/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: 准备 llvm-meson-wrap 文件
        run: |
          mkdir -p subprojects
          cat > subprojects/llvm.wrap <<EOF
          [wrap-file]
          directory = llvm
          source_url = https://github.com/llvm/llvm-project/releases/download/llvmorg-15.0.0/llvm-project-15.0.0.src.tar.xz
          source_filename = llvm-15.0.0.tar.xz
          source_hash = 1234567890abcdef
          patch_directory = llvm
          EOF
          echo "已创建 llvm.wrap"

      # x86_64 构建
      - name: 构建 x86_64 Android
        env:
          CROSS: x86_64-linux-android
          GALLIUM_DRIVERS: iris,radeonsi,softpipe,virgl,zink
          VULKAN_DRIVERS: amd,intel,nouveau,swrast,virtio
          BUILDTYPE: debug
          UNWIND: disabled
          C_ARGS: -Wno-error=asm-operand-widths -Wno-error=constant-conversion -Wno-error=enum-conversion -Wno-error=initializer-overrides -Wno-error=sometimes-uninitialized
          CPP_ARGS: -Wno-error=c99-designator
          DRI_LOADERS: -D glx=disabled -D gbm=disabled -D egl=enabled -D glvnd=disabled -D platforms=android
          EXTRA_OPTION: -D amd-use-llvm=false -D android-stub=true -D platform-sdk-version=${{ env.ANDROID_SDK_VERSION }} -D cpp_rtti=false -D valgrind=disabled -D android-libbacktrace=disabled -D mesa-clc=system -D precomp-compiler=system -D perfetto=true -D freedreno-kmds=msm,virtio
          GALLIUM_ST: -D gallium-va=disabled -D gallium-rusticl=false
          PKG_CONFIG_LIBDIR: /disable/non/android/system/pc/files
          # 关键修复：添加 -D libclc=disabled 以避免主机构建查找 libclc
          HOST_BUILD_OPTIONS: >
            -D build-tests=false
            -D enable-glcpp-tests=false
            -D gallium-drivers=
            -D vulkan-drivers=
            -D video-codecs=
            -D glx=disabled
            -D platforms=
            -D mesa-clc=enabled
            -D install-mesa-clc=true
            -D precomp-compiler=enabled
            -D install-precomp-compiler=true
            -D tools=panfrost
            -D libclc=disabled
        run: |
          export PATH=$HOME/.local/bin:$PATH
          meson --version
          meson setup _host_build $HOST_BUILD_OPTIONS
          ninja -C _host_build

          cat > android-${CROSS}.txt <<EOF
          [binaries]
          c = '${CROSS}26-clang'
          cpp = '${CROSS}26-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          [host_machine]
          system = 'android'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

          meson setup _build \
            --cross-file android-${CROSS}.txt \
            -D buildtype=$BUILDTYPE \
            -D unwind=$UNWIND \
            -D c_args="$C_ARGS" \
            -D cpp_args="$CPP_ARGS" \
            $DRI_LOADERS \
            $GALLIUM_ST \
            -D gallium-drivers=$GALLIUM_DRIVERS \
            -D vulkan-drivers=$VULKAN_DRIVERS \
            $EXTRA_OPTION \
            -D pkg_config_libdir="$PKG_CONFIG_LIBDIR"

          ninja -C _build
          mkdir -p artifacts-x86_64
          cp -r _build/meson-logs artifacts-x86_64/ || true
          tar czf mesa-x86_64-android-${BUILDTYPE}.tar.gz _build/install/ || true

      - name: 清理中间文件
        run: |
          rm -rf _build _host_build
          git clean -dxf .

      # aarch64 构建
      - name: 构建 aarch64 Android
        env:
          CROSS: aarch64-linux-android
          GALLIUM_DRIVERS: etnaviv,freedreno,lima,panfrost,vc4,v3d,zink
          VULKAN_DRIVERS: freedreno,broadcom,panfrost,virtio
          BUILDTYPE: debug
          UNWIND: disabled
          C_ARGS: -Wno-error=asm-operand-widths -Wno-error=constant-conversion -Wno-error=enum-conversion -Wno-error=initializer-overrides -Wno-error=sometimes-uninitialized
          CPP_ARGS: -Wno-error=c99-designator
          DRI_LOADERS: -D glx=disabled -D gbm=disabled -D egl=enabled -D glvnd=disabled -D platforms=android
          EXTRA_OPTION: -D amd-use-llvm=false -D android-stub=true -D platform-sdk-version=${{ env.ANDROID_SDK_VERSION }} -D cpp_rtti=false -D valgrind=disabled -D android-libbacktrace=disabled -D mesa-clc=system -D precomp-compiler=system -D perfetto=true -D freedreno-kmds=msm,virtio
          GALLIUM_ST: -D gallium-va=disabled -D gallium-rusticl=false
          PKG_CONFIG_LIBDIR: /disable/non/android/system/pc/files
          HOST_BUILD_OPTIONS: >
            -D build-tests=false
            -D enable-glcpp-tests=false
            -D gallium-drivers=
            -D vulkan-drivers=
            -D video-codecs=
            -D glx=disabled
            -D platforms=
            -D mesa-clc=enabled
            -D install-mesa-clc=true
            -D precomp-compiler=enabled
            -D install-precomp-compiler=true
            -D tools=panfrost
            -D libclc=disabled
        run: |
          export PATH=$HOME/.local/bin:$PATH
          meson --version
          meson setup _host_build $HOST_BUILD_OPTIONS
          ninja -C _host_build

          cat > android-${CROSS}.txt <<EOF
          [binaries]
          c = '${CROSS}26-clang'
          cpp = '${CROSS}26-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

          meson setup _build \
            --cross-file android-${CROSS}.txt \
            -D buildtype=$BUILDTYPE \
            -D unwind=$UNWIND \
            -D c_args="$C_ARGS" \
            -D cpp_args="$CPP_ARGS" \
            $DRI_LOADERS \
            $GALLIUM_ST \
            -D gallium-drivers=$GALLIUM_DRIVERS \
            -D vulkan-drivers=$VULKAN_DRIVERS \
            $EXTRA_OPTION \
            -D pkg_config_libdir="$PKG_CONFIG_LIBDIR"

          ninja -C _build
          mkdir -p artifacts-aarch64
          cp -r _build/meson-logs artifacts-aarch64/ || true
          tar czf mesa-arm64-android-${BUILDTYPE}.tar.gz _build/install/ || true

      - name: 上传所有 Android 构建制品
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-android-artifacts
          path: |
            mesa-*-android-*.tar.gz
            artifacts-*/
